x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://aiwardrobe@postgres:5432/aiwardrobe
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique random POSTGRES_PASSWORD of at least 32 bytes}
  JWT_SECRET: ${JWT_SECRET:?Set a unique random JWT_SECRET of at least 32 bytes}
  FRONTEND_ORIGIN: http://localhost:5173
  STORAGE_DRIVER: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: aiwardrobe
  WEDDING_S3_BUCKET: ${WEDDING_S3_BUCKET:-aiwardrobe-wedding-private}
  S3_REGION: auto
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set an operator-provided S3 access key}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set a unique random S3 secret of at least 32 bytes}
  PUBLIC_STORAGE_BASE_URL: http://localhost:9100/aiwardrobe
  AI_DEMO_MODE: "true"
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
  GARMENT_AI_PROVIDER: ${GARMENT_AI_PROVIDER:-qwen}
  PROVIDER_CONCURRENCY_LIMIT: ${PROVIDER_CONCURRENCY_LIMIT:-4}
  PROVIDER_HOURLY_SUBMISSION_LIMIT: ${PROVIDER_HOURLY_SUBMISSION_LIMIT:-20}
  WEDDING_MEDIA_MODE: ${WEDDING_MEDIA_MODE:-disabled}
  WEDDING_STORY_PROVIDER: ${WEDDING_STORY_PROVIDER:-disabled}
  WEDDING_STORY_API_KEY: ${WEDDING_STORY_API_KEY:-}
  WEDDING_STORY_MODEL: ${WEDDING_STORY_MODEL:-doubao-seed-2-0-pro-260215}
  WEDDING_FRAME_PROVIDER: ${WEDDING_FRAME_PROVIDER:-disabled}
  WEDDING_FRAME_API_KEY: ${WEDDING_FRAME_API_KEY:-}
  WEDDING_FRAME_MODEL: ${WEDDING_FRAME_MODEL:-doubao-seedream-4-5-251128}
  WEDDING_CHARACTER_VIDEO_PROVIDER: ${WEDDING_CHARACTER_VIDEO_PROVIDER:-disabled}
  WEDDING_CHARACTER_VIDEO_API_KEY: ${WEDDING_CHARACTER_VIDEO_API_KEY:-}
  WEDDING_CHARACTER_VIDEO_MODEL: ${WEDDING_CHARACTER_VIDEO_MODEL:-wan2.7-r2v-2026-06-12}
  WEDDING_SCENE_VIDEO_PROVIDER: ${WEDDING_SCENE_VIDEO_PROVIDER:-disabled}
  WEDDING_SCENE_VIDEO_API_KEY: ${WEDDING_SCENE_VIDEO_API_KEY:-}
  WEDDING_SCENE_VIDEO_MODEL: ${WEDDING_SCENE_VIDEO_MODEL:-wan2.6-i2v-flash}
  WEDDING_ACCOUNT_BUDGET_LIMIT_FEN: ${WEDDING_ACCOUNT_BUDGET_LIMIT_FEN:-15000}
  WEDDING_WORKER_STALE_SECONDS: ${WEDDING_WORKER_STALE_SECONDS:-1800}
  WEDDING_FFMPEG_PATH: ${WEDDING_FFMPEG_PATH:-ffmpeg}
  WEDDING_FFPROBE_PATH: ${WEDDING_FFPROBE_PATH:-ffprobe}
  WEDDING_SUBTITLE_FONT: ${WEDDING_SUBTITLE_FONT:-Noto Sans CJK SC}
  WEDDING_MUSIC_FILE: ${WEDDING_MUSIC_FILE:-}
  WEDDING_MUSIC_LICENSE_ID: ${WEDDING_MUSIC_LICENSE_ID:-}

# Compose >=2.24; additional WEDDING_* prices/catalog/limits reach BOTH services.
x-wedding-runtime: &wedding-runtime
  env_file:
    - path: ./.env
      required: false
  volumes:
    - ${WEDDING_MUSIC_DIRECTORY:-./runtime/wedding-music}:/wedding-music:ro

services:
  validate-config:
    build:
      context: ./backend
    command: ["python", "-c", "from app.config import get_settings; get_settings()"]
    environment: *backend-environment

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiwardrobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique random POSTGRES_PASSWORD of at least 32 bytes}
      POSTGRES_DB: aiwardrobe
    depends_on:
      validate-config:
        condition: service_completed_successfully
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwardrobe -d aiwardrobe"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set an operator-provided S3 access key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set a unique random S3 secret of at least 32 bytes}
    depends_on:
      validate-config:
        condition: service_completed_successfully
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set health http://localhost:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null && mc ready health"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      WEDDING_S3_BUCKET: ${WEDDING_S3_BUCKET:-aiwardrobe-wedding-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set an operator-provided S3 access key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set a unique random S3 secret of at least 32 bytes}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null &&
        mc mb --ignore-existing local/aiwardrobe &&
        mc anonymous set none local/aiwardrobe &&
        mc mb --ignore-existing "local/$$WEDDING_S3_BUCKET" &&
        mc anonymous set none "local/$$WEDDING_S3_BUCKET"

  migrate:
    <<: *wedding-runtime
    build:
      context: ./backend
    command: ["python", "-m", "app.migrations", "upgrade"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *wedding-runtime
    build:
      context: ./backend
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  wedding-worker:
    <<: *wedding-runtime
    build:
      context: ./backend
    command: ["python", "-m", "app.wedding_worker", "--poll-seconds", "2"]
    environment: *backend-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *wedding-runtime
    build:
      context: ./backend
    command: ["python", "-m", "app.task_worker"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    environment:
      VITE_BACKEND_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  minio-data:
