services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiwardrobe
      POSTGRES_PASSWORD: aiwardrobe
      POSTGRES_DB: aiwardrobe
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwardrobe -d aiwardrobe"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/aiwardrobe &&
      mc anonymous set download local/aiwardrobe
      "

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aiwardrobe:aiwardrobe@postgres:5432/aiwardrobe
      JWT_SECRET: docker-development-secret-with-at-least-thirty-two-bytes
      FRONTEND_ORIGIN: http://localhost:5173
      STORAGE_DRIVER: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: aiwardrobe
      S3_REGION: auto
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      PUBLIC_STORAGE_BASE_URL: http://localhost:9100/aiwardrobe
      AI_DEMO_MODE: "true"
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    environment:
      VITE_BACKEND_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  minio-data:
