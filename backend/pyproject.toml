[project]
name = "aiwardrobe-backend"
version = "0.1.0"
description = "FastAPI backend for the AiWardrobe MVP"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.1.2",
    "boto3>=1.34.0",
    "email-validator>=2.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.4.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
